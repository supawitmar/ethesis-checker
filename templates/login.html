<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>เข้าสู่ระบบ — E-Thesis Staff Checker</title>
  <style>
  /* ออกแบบใหม่ (ก.ย. 2569) ชุดเดียวกับหน้าอัปโหลดและหน้ารายงาน */
  :root { --navy:#16365a; --navy-2:#23548a; --navy-3:#2f6db3; --navy-soft:#eef3fa;
          --gold:#c9a227; --bg:#f4f6fa; --surface:#ffffff; --line:#e4e9f0; --line-2:#d5dde8;
          --ink:#16212e; --ink-2:#465567; --ink-3:#7a8797;
          --ring:0 0 0 3px rgba(47,109,179,.22);
          --shadow:0 1px 2px rgba(16,24,40,.04), 0 16px 40px -18px rgba(16,24,40,.22);
          --font:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun','Segoe UI',Tahoma,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:var(--font); font-size:15px; line-height:1.55; color:var(--ink);
      background:linear-gradient(180deg,#e9eff8 0, var(--bg) 420px) no-repeat, var(--bg); }
    .login { width:100%; max-width:400px; }
    .brand { display:flex; align-items:center; gap:12px; margin:0 0 18px 4px; }
    .brand-mark { flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:12px;
      font-size:1.3rem; background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);
      box-shadow:0 6px 14px -6px rgba(22,54,90,.6); }
    .brand-name { font-weight:700; font-size:1.05rem; color:var(--navy); line-height:1.2; }
    .brand-sub { font-size:.78rem; color:var(--ink-3); }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:18px;
      box-shadow:var(--shadow); padding:30px 30px 28px; }
    h1 { margin:0 0 4px; color:var(--navy); font-size:1.35rem; font-weight:700; letter-spacing:-.01em; }
    .sub { color:var(--ink-3); margin-bottom:22px; font-size:.9rem; }
    label { display:block; font-weight:600; font-size:.84rem; color:var(--ink-2); margin-bottom:6px; }
    input { width:100%; min-height:46px; padding:11px 14px; border:1px solid var(--line-2); border-radius:10px;
      font:inherit; margin-bottom:18px; background-color:#fff;
      transition:border-color .15s, box-shadow .15s; }
    input:hover { border-color:#b9c5d4; }
    input:focus { outline:none; border-color:var(--navy-3); box-shadow:var(--ring); }
    button { width:100%; min-height:48px; padding:12px; color:#fff; border:0; border-radius:12px; font:inherit;
      font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);
      box-shadow:0 12px 24px -12px rgba(22,54,90,.7); transition:filter .15s, transform .05s; }
    button:hover { filter:brightness(1.08); }
    button:active { transform:translateY(1px); }
    button:focus-visible { outline:none; box-shadow:var(--ring); }
    button:disabled { opacity:.55; cursor:not-allowed; box-shadow:none; filter:none; }
    .error { background:#fdf0ef; color:#a12626; border:1px solid #f3d3cf; padding:10px 14px;
      border-radius:10px; margin-bottom:18px; font-size:.88rem; }
    .warning { background:#fff7df; color:#785b00; border:1px solid #f1e2ad; padding:10px 14px;
      border-radius:10px; margin-bottom:18px; font-size:.88rem; }
    .foot { text-align:center; margin-top:16px; font-size:.78rem; color:var(--ink-3); }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">📋</div>
      <div>
        <div class="brand-name">E-Thesis Staff Checker</div>
        <div class="brand-sub">ตรวจรูปเล่มวิทยานิพนธ์อิเล็กทรอนิกส์</div>
      </div>
    </div>
    <div class="card">
      <h1>เข้าสู่ระบบ</h1>
      <div class="sub">กรอกรหัสผ่านเพื่อเข้าใช้งานระบบ</div>
      {% if not configured %}<div class="warning">ผู้ดูแลระบบยังไม่ได้ตั้งค่า APP_PASSWORD</div>{% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form action="/login" method="post">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit" {% if not configured %}disabled{% endif %}>เข้าสู่ระบบ</button>
      </form>
    </div>
    <div class="foot">บัณฑิตวิทยาลัย มหาวิทยาลัยมหิดล</div>
  </main>
</body>
</html>
