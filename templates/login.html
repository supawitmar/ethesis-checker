<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>เข้าสู่ระบบ — E-Thesis Staff Checker</title>
  <style>
  :root { --navy:#16365a; --navy-2:#23548a; --navy-soft:#edf3fa;
          --gold:#c9a227; --gold-soft:#fcf7e6; --gold-line:#efe1b0;
          --bg:#f2f5f9; --surface:#ffffff; --line:#e3e8ef; --line-2:#d2dae5;
          --ink:#1c2733; --ink-2:#4a5868; --ink-3:#7b8898;
          --ok:#1e8449; --ok-bg:#eaf7ef;
          --ring:0 0 0 3px rgba(35,84,138,.2);
          --shadow-sm:0 1px 2px rgba(16,24,40,.06);
          --shadow:0 1px 3px rgba(16,24,40,.05), 0 12px 32px -14px rgba(16,24,40,.18);
          --font:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun','Segoe UI',Tahoma,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:var(--font); font-size:15px; line-height:1.55; color:var(--ink);
      background:radial-gradient(900px 480px at 0% 0%, #dbe6f4 0%, transparent 62%),
                 radial-gradient(760px 420px at 100% 100%, #f4ebcf 0%, transparent 58%), var(--bg); }
    .login { position:relative; width:100%; max-width:410px; background:var(--surface);
      border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
      padding:40px 36px 34px; overflow:hidden; }
    .login::before { content:""; position:absolute; left:0; right:0; top:0; height:4px;
      background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 62%,var(--gold) 100%); }
    h1 { margin:0 0 6px; color:var(--navy); font-size:1.4rem; font-weight:700; letter-spacing:-.01em; }
    .sub { color:var(--ink-3); margin-bottom:26px; font-size:.92rem; }
    label { display:block; font-weight:600; font-size:.88rem; color:var(--ink-2); margin-bottom:8px; }
    input { width:100%; padding:12px 14px; border:1px solid var(--line-2); border-radius:10px;
      font:inherit; margin-bottom:18px; background-color:#fbfcfe;
      transition:border-color .15s, box-shadow .15s, background-color .15s; }
    input:focus { outline:none; border-color:var(--navy-2); box-shadow:var(--ring); background-color:#fff; }
    button { width:100%; padding:12px; background:var(--navy); color:#fff; border:0;
      border-radius:10px; font:inherit; font-weight:700; cursor:pointer;
      box-shadow:0 8px 18px -8px rgba(22,54,90,.6); transition:background .15s, transform .05s; }
    button:hover { background:var(--navy-2); }
    button:active { transform:translateY(1px); }
    button:focus-visible { outline:none; box-shadow:var(--ring); }
    button:disabled { opacity:.55; cursor:not-allowed; box-shadow:none; }
    .error { background:#fdf0ef; color:#a12626; border:1px solid #f3d3cf; padding:10px 14px;
      border-radius:10px; margin-bottom:18px; font-size:.9rem; }
    .warning { background:#fff7df; color:#785b00; border:1px solid #f1e2ad; padding:10px 14px;
      border-radius:10px; margin-bottom:18px; font-size:.9rem; }
  </style>
</head>
<body>
  <main class="login">
    <h1>E-Thesis Staff Checker</h1>
    <div class="sub">กรอกรหัสผ่านเพื่อเข้าใช้งานระบบ</div>
    {% if not configured %}<div class="warning">ผู้ดูแลระบบยังไม่ได้ตั้งค่า APP_PASSWORD</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form action="/login" method="post">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="password">รหัสผ่าน</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" {% if not configured %}disabled{% endif %}>เข้าสู่ระบบ</button>
    </form>
  </main>
</body>
</html>
